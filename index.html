<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>小游戏合集</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;background:#09090d;color:#f5f2ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 45% 20%,rgba(191,58,114,.18),transparent 34%),linear-gradient(135deg,#09090d,#17111d 58%,#0a0a0f)}main{width:min(1040px,calc(100% - 32px));margin:0 auto;padding:48px 0}.eyebrow{margin:0 0 8px;color:#d0a9ff;font-size:13px;text-transform:uppercase}h1{margin:0 0 12px;font-size:clamp(34px,6vw,64px);line-height:1}p{margin:0;color:#bcb3ca;line-height:1.65}.game-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:28px}.game-card{display:grid;min-height:210px;padding:20px;border:1px solid rgba(232,202,255,.2);border-radius:8px;color:inherit;text-decoration:none;background:rgba(18,16,25,.82);box-shadow:0 20px 60px rgba(0,0,0,.28)}.game-card:hover{border-color:rgba(255,119,170,.7);background:rgba(31,20,35,.9)}.thumb{min-height:108px;border:1px solid rgba(255,255,255,.14);border-radius:6px;background:linear-gradient(rgba(10,8,14,.28),rgba(10,8,14,.28)),url("./game-1/assets/M9S-MAP.png") center/cover}h2{margin:16px 0 6px;font-size:22px}.meta{margin-top:auto;padding-top:18px;color:#ff9fc4;font-weight:700}
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Mini Games Collection</p>
      <h1>小游戏合集</h1>
      <p>这里会收纳多个网页小游戏。目前先放第一款 FF14 机制练习器，之后可以继续添加第二款、第三款。</p>
    </header>
    <section class="game-grid" aria-label="小游戏列表">
      <a class="game-card" href="./game-1/">
        <div class="thumb" aria-hidden="true"></div>
        <h2>血蝠死斗机制练习器</h2>
        <p>单人键盘移动，练习分摊塔、蝙蝠连线、八方水波和钢铁/月环处理。</p>
        <span class="meta">开始练习</span>
      </a>
    </section>
  </main>
</body>
</html>
